[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist-mini"
version = "0.1.0"
description = "Offline, auditable Rule-Based Scientist and synthetic experiment workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.scripts]
aiscientist-mini = "aiscientist.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

