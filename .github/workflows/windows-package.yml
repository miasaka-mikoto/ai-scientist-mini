name: windows-package

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "scripts/build_exe.ps1"
      - "scripts/launcher.py"
      - "pyproject.toml"
      - ".github/workflows/windows-package.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and packaging tools
        shell: pwsh
        run: python -m pip install --no-build-isolation -e ".[dev]" pyinstaller
      - name: Build and smoke-test AIScientistMini.exe
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Clean -RunTests -SmokeDemo
      - name: Zip Windows portable bundle
        shell: pwsh
        run: Compress-Archive -Path dist\AIScientistMini -DestinationPath AIScientistMini_windows_x86_64_v0.1.0.zip -Force
      - name: Upload Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: AIScientistMini-windows-x86_64-v0.1.0
          path: AIScientistMini_windows_x86_64_v0.1.0.zip
