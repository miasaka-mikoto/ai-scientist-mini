name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller numpy
      - name: Build AIScientistMini.exe
        shell: pwsh
        run: ./build_windows.ps1 -Clean
      - name: Smoke test executable
        shell: pwsh
        run: |
          & ./dist/AIScientistMini.exe --headless | Out-File -Encoding utf8 smoke.json
          $data = Get-Content smoke.json -Raw | ConvertFrom-Json
          if ($data.hypotheses.Count -lt 5 -or $data.runs.Count -lt 20) { throw "Demo smoke test failed" }
          & ./dist/AIScientistMini.exe --demo --output smoke-output | Out-File -Encoding utf8 demo.json
          $demo = Get-Content demo.json -Raw | ConvertFrom-Json
          if ($demo.hypotheses -lt 5 -or $demo.runs -lt 20 -or $demo.cost -ne 0) { throw "Packaged demo failed" }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AIScientistMini-windows
          path: dist/AIScientistMini.exe
